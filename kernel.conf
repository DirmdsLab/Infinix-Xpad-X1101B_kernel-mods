# Source selection. setup reuses a matching complete checkout, otherwise syncs
# the configured manifest and exact commit into src/. All paths below are
# relative to that checkout. This workflow uses the legacy AOSP build.sh driver.
MANIFEST_URL="https://android.googlesource.com/kernel/manifest"
MANIFEST_BRANCH="common-android12-5.10-2024-05"
KERNEL_PROJECT="kernel/common"
KERNEL_SUBDIR="common"
KERNEL_COMMIT="7c6bbcca33e1734642601acf07a14140116fa956"
BUILD_CONFIG="common/build.config.gki.aarch64"
CLANG_BIN="prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
JOBS=2
LTO="thin"

# These checks describe the tested X1101B + Droidspaces baseline. Change the
# expected release and requirements deliberately when testing another kernel.
EXPECTED_RELEASE="5.10.209-android12-9-g7c6bbcca33e1-uwu"
BOOT_IMAGE_SIZE=67108864
REQUIRED_CONFIG=(
  CONFIG_SYSVIPC=y
  CONFIG_POSIX_MQUEUE=y
  CONFIG_IPC_NS=y
  CONFIG_PID_NS=y
  CONFIG_DEVTMPFS=y
  CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
  CONFIG_MODVERSIONS=y
  CONFIG_LTO_CLANG_THIN=y
  CONFIG_CFS_BANDWIDTH=n
  CONFIG_CGROUP_PIDS=n
)
